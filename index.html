<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>分享</title>
<style>
  :root {
    --bg: #f6f7f6; --surface: #ffffff; --surface-2: #eef2f1;
    --text: #17201e; --muted: #5b6764; --line: #dde3e1;
    --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #dff1ee;
    --radius: 14px; --shadow: 0 1px 2px rgb(15 60 55 / .06), 0 8px 24px rgb(15 60 55 / .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1413; --surface: #161d1b; --surface-2: #1d2624;
      --text: #e7eeec; --muted: #9aa8a4; --line: #27322f;
      --accent: #3fb5a8; --accent-ink: #0b1312; --accent-soft: #173330;
      --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  a { color: var(--accent); }
  .wrap { max-width: 720px; margin: 0 auto;
    padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  header { padding: 36px 0 8px; }
  h1 { font-size: clamp(30px, 8vw, 44px); line-height: 1.15; font-weight: 800; letter-spacing: -.01em; margin: 0; }
  .intro { color: var(--muted); margin: 10px 0 0; max-width: 60ch; }
  .updated { font-size: 14px; color: var(--muted); margin-top: 10px; }
  h2 { font-size: 20px; margin: 32px 0 12px; }
  .items { display: grid; gap: 12px; }
  a.item { display: block; text-decoration: none; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 44px 16px 18px; position: relative;
    transition: border-color .2s, transform .15s; }
  a.item::after { content: "›"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 28px; line-height: 1; color: var(--accent); }
  a.item:active { transform: scale(.99); border-color: var(--accent); }
  @media (hover: hover) { a.item:hover { border-color: var(--accent); } }
  .item-top { display: flex; justify-content: space-between; gap: 4px 12px; align-items: baseline; flex-wrap: wrap; }
  .item-title { font-size: 18px; font-weight: 700; }
  .item-date { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .item-sum { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .tag { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; }
  .empty { color: var(--muted); background: var(--surface-2); border-radius: var(--radius); padding: 18px; }
  ul.log { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
  footer { margin-top: 40px; font-size: 14px; color: var(--muted); text-align: center; }
  .gate { min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
  .gate b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
  .skeleton { height: 18px; border-radius: 8px; background: var(--surface-2); margin: 12px 0; }
  @media (prefers-reduced-motion: no-preference) {
    .items > * { animation: rise .3s cubic-bezier(.16, 1, .3, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<div id="app" class="wrap">
  <div style="padding-top:40px"><div class="skeleton" style="width:50%;height:38px"></div><div class="skeleton" style="width:70%"></div><div class="skeleton" style="height:90px"></div></div>
</div>
<script>
const PAYLOAD = {"v": 1, "iv": "TE4kAfKBNPxcH6he", "ct": "3hCjhe+doPQEaKjGMo6plt28WOWtg0Ywf5OEZ5g7JPFXXXYgWxmlf7H8t4C2F7Km3qLfVEBznqx2+MNEx0RQhMIiIOA2i9KiMeVdW8p/Wj2j7JTk+Cn+cTrmrtjskA/jmiOUdDAumm30WsCfIVGX0mT8316QreRsvjAtURGzxqjWg5Sk1AYL7+BMLqlnXCifzykl49VnD00zPT5bsm/w1CJ12mezl2fkKQraKJUWvNpJqP1InyGKOvHqrTwUmtvblI1A5XJc57KtBCSpvx3MMbJjoFK+FuA1WPOcBaZ/bn2Dzdh+qWHHpu9H+jz2wvTZdUWiwI4y8WwiT19IP3kfFshHGMPNoVAKxxKLQ5BciEPu7aofE2VeQq99lseIWh5JYPIUYslhq8yRIJM87Ub2r+loUOLe4wGqrCgALOtSL0MZWlNLjI/sz2JHQ49YkngbfXA+0OETScfmlB5zpHdxPNfQZUl5erpWtpEVcSJZ4lPxBZNrWFV2gGd4UDL7GkduTL6RPzuvGIEfcjlsp2azBlRjxRX7P/zBDWWYm98mGeyHT17S1nAxBSaTgU+1ZkUxq6pUUekUe/MyBmXqB6DWdnu4d1sXZRDFHUtBFab2BjswLADEwY3GFcpIUOLG+vlbW4RVX5sbureUzmsr7Nwabu+hIXHR8A4MxtEI4Mty08mr5lHpENzFtvWrNdTJc6wCqW50KjXa3V5ujLBv8PyJEbGiX2uc37A8ozP7KBUySwSOxmGQQdWQaHY2Fkx/U+g3rMV0SQ51tJvwRdo7tVrQ+/fB9ddw+jJ5F12e+C3A/J06udE/cUsRaHx8ingd0dTspN1L4Vn+NQ=="};
const STORE = "sharekey:" + location.pathname.split("/").slice(0, 2).join("/");

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64u = s => b64(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
const gate = (t, m) => document.getElementById("app").replaceChildren(el("div", { class: "gate" }, el("div", {}, el("b", {}, t), m)));

function getKey() {
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if (m) { try { localStorage.setItem(STORE, m[1]); } catch (e) {} return m[1]; }
  try { return localStorage.getItem(STORE); } catch (e) { return null; }
}

async function decrypt(keyText) {
  const key = await crypto.subtle.importKey("raw", b64u(keyText), "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function render(d, keyText) {
  document.title = d.title || "分享";
  const items = d.items || [];
  document.getElementById("app").replaceChildren(
    el("header", {},
      el("h1", {}, d.title),
      d.intro ? el("p", { class: "intro" }, d.intro) : null,
      el("div", { class: "updated" }, `最後更新 ${d.updated}，重新整理就會看到最新版`)),
    el("h2", {}, "分享給你的"),
    items.length
      ? el("div", { class: "items" }, items.map(it => el("a", { class: "item", href: `./${it.slug}/#k=${keyText}` },
          el("div", { class: "item-top" }, el("span", { class: "item-title" }, it.title), it.date ? el("span", { class: "item-date" }, it.date) : null),
          it.summary ? el("div", { class: "item-sum" }, it.summary) : null,
          it.tag ? el("span", { class: "tag" }, it.tag) : null)))
      : el("div", { class: "empty" }, "目前還沒有內容，之後有東西會放在這裡。"),
    (d.changelog || []).length ? el("h2", {}, "更新紀錄") : null,
    (d.changelog || []).length ? el("ul", { class: "log" }, d.changelog.map(c => el("li", {}, `${c.date} ${c.text}`))) : null,
    el("footer", {}, "把這一頁加進書籤，之後新的內容都會出現在這裡。")
  );
}

(async () => {
  if (!PAYLOAD) return gate("還沒有內容", "這一頁還沒產生資料。");
  if (!window.crypto?.subtle) return gate("瀏覽器不支援", "請用 Safari、Chrome 等新版瀏覽器打開。");
  const key = getKey();
  if (!key) return gate("需要分享連結", "請用對方傳給你的完整連結打開這一頁。");
  try { render(await decrypt(key), key); }
  catch (e) { gate("連結不完整或已更換", "請跟對方要最新的分享連結。"); }
})();
</script>
</body>
</html>
