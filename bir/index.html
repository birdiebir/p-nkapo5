<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>對話</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf6ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e141d" media="(prefers-color-scheme: dark)">
<style>
  /* Bir 對話頁（2026-11-02）：照 docs\設計規範.md，token 與 hub.html 同一套。
     一頁一個畫面：標題列（返回、Bir 狀態、換身分）＋訊息串＋黏在下面的輸入列。
     訊息格式見 bir\chatcrypto.py；之後換 P62 的 chat UI 只換這一頁。 */
  :root {
    --bg: #fbf6ef; --surface: #ffffff; --surface-2: #fff0e6;
    --text: #2b2233; --muted: #6f6475; --line: #f0e2d8;
    --accent: #0b7067; --accent-ink: #ffffff; --accent-soft: #dcf3ef;
    --coral: #e8625a; --coral-ink: #b8433b; --coral-soft: #ffe7e2; --sun: #ffc65c; --sun-soft: #fff4d6;
    --warn: #9a4a07; --warn-soft: #fdf0dc;
    --radius: 22px; --shadow: 0 1px 2px rgb(184 67 59 / .05), 0 10px 28px rgb(184 67 59 / .08);
    --bounce: cubic-bezier(.34, 1.56, .64, 1);
    --f-hand: "TripHand", "Kaiti TC", "STKaiti", "BiauKai", "DFKai-SB", serif;
    --f-sys: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e141d; --surface: #142030; --surface-2: #1a293b;
      --text: #f4eff7; --muted: #aaa3b6; --line: #24344a;
      --accent: #5fd0c2; --accent-ink: #062320; --accent-soft: #143a3a;
      --coral: #ff8f80; --coral-ink: #ffa597; --coral-soft: #3a2228; --sun: #ffd277; --sun-soft: #33301f;
      --warn: #f2b25c; --warn-soft: #3a2a12;
      --shadow: 0 1px 2px rgb(0 0 0 / .35), 0 10px 28px rgb(0 0 0 / .3);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 var(--f-sys); }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .ab-title, .gate b {
    font-family: var(--f-hand); font-weight: 500; font-synthesis: none; letter-spacing: .01em; word-spacing: -.12em; }

  /* ===== 整頁畫面：沒金鑰、密語、選身分 ===== */
  .gate { min-height: 100dvh; display: grid; place-items: center; padding: 24px 0; text-align: center; color: var(--muted); }
  .gate b { display: block; margin-bottom: 6px; color: var(--text); font-size: 22px; line-height: 1.3; text-wrap: balance; }
  .gate .card { width: min(360px, 100%); text-align: left; }
  .gate .card > p { margin: 0 0 16px; font-size: 14px; line-height: 1.6; color: var(--muted); }
  .card { background: var(--surface); border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 16px 16px; }
  form.pass { display: grid; gap: 10px; }
  form.pass label { font-size: 14px; font-weight: 650; color: var(--muted); }
  form.pass input { width: 100%; min-height: 44px; padding: 0 14px; font: inherit; font-size: 16px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer;
    box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 25%, transparent); transition: transform .1s ease-out; }
  .btn:active { transform: scale(.96); }
  .err { margin: 0; min-height: 1.6em; font-size: 14px; color: var(--coral-ink); }
  .who { display: grid; gap: 10px; margin-top: 12px; }
  .who button { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 16px; border-radius: 18px; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--line) 85%, transparent); background: var(--bg); color: var(--text);
    font: inherit; font-size: 16px; font-weight: 700; text-align: left; transition: transform .1s ease-out, background-color .2s; }
  .who button:active { transform: scale(.98); }
  .who .sw { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; font-size: 15px; font-weight: 700; }
  .who [data-who=a] .sw { background: var(--coral-soft); color: var(--coral-ink); }
  .who [data-who=b] .sw { background: var(--accent-soft); color: var(--accent); }
  .note { margin: 12px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted); }

  /* ===== App 殼：標題列＋訊息串＋輸入列 ===== */
  .chat { min-height: 100dvh; display: flex; flex-direction: column; }
  .appbar { position: sticky; top: 0; z-index: 25; margin: 0 -16px; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 1px 0 color-mix(in srgb, var(--line) 60%, transparent); }
  .ab-row { display: flex; align-items: center; gap: 4px; min-height: 44px; }
  .ab-back { flex: none; display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin-left: -8px; padding: 0 8px 0 2px;
    color: var(--accent); font-size: 16px; font-weight: 600; text-decoration: none; transition: transform .1s ease-out; }
  .ab-back:active { transform: scale(.96); }
  .ab-back svg { width: 22px; height: 22px; display: block; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .ab-title { flex: 1; min-width: 0; margin: 0; font-size: 25px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ab-who { flex: none; min-height: 44px; margin-right: -6px; padding: 0 6px; border: 0; background: none; cursor: pointer; font: inherit; }
  .ab-who span { display: inline-block; padding: 1px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 13px; font-weight: 700; line-height: 1.6; }
  .ab-who:active span { transform: scale(.94); }
  .bir-status { display: flex; align-items: center; gap: 8px; margin: 2px 0 0; font-size: 13px; font-weight: 600; line-height: 1.6; color: var(--muted); }
  .bir-status::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .bir-status.busy::before { background: var(--sun); box-shadow: 0 0 0 3px var(--sun-soft); }
  .bir-status.off { margin: 8px -16px -10px; padding: 8px 16px; background: var(--warn-soft); color: var(--warn); }
  .bir-status.off::before { background: var(--warn); }
  .offline { margin: 8px -16px -10px; padding: 8px 16px; font-size: 14px; font-weight: 600; text-align: center; background: var(--warn-soft); color: var(--warn); }

  .thread { flex: 1; padding: 6px 0 16px; }
  ol.msgs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .day { align-self: center; margin: 16px 0 4px; padding: 1px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted);
    font-size: 12px; font-weight: 600; line-height: 1.6; font-variant-numeric: tabular-nums; }
  .m { display: flex; flex-direction: column; align-items: flex-start; margin-top: 4px; }
  .m.me { align-items: flex-end; }
  .m.first { margin-top: 12px; }
  .m .name { margin: 0 12px 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .bubble { max-width: min(84%, 520px); padding: 8px 14px; border-radius: 20px; font-size: 16px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .from-a .bubble { background: var(--coral-soft); }
  .from-b .bubble { background: var(--accent-soft); }
  .from-bir .bubble { background: var(--surface); border: 1px solid color-mix(in srgb, var(--line) 85%, transparent); }
  .m.me .bubble { border-bottom-right-radius: 6px; }
  .m:not(.me) .bubble { border-bottom-left-radius: 6px; }
  .meta { margin: 2px 8px 0; font-size: 12px; line-height: 1.6; color: var(--muted); font-variant-numeric: tabular-nums; }
  .m.queued .bubble { opacity: .72; }
  .retry { margin-top: 4px; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--warn-soft); color: var(--warn); font: inherit; font-size: 13px; font-weight: 700; transition: transform .1s ease-out; }
  .retry:active { transform: scale(.94); }
  .retry svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .chg { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); white-space: normal; }
  .chg-h { font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--muted); }
  .chg ul { list-style: none; margin: 2px 0 0; padding: 0; }
  .chg li { padding: 4px 0; font-size: 14px; line-height: 1.55; }
  .chg li b { display: block; font-weight: 700; }
  .chg .ba { color: var(--muted); }
  .chg .ba strong { color: var(--text); font-weight: 600; }
  .chg .gos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chg .go { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 16px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 700; text-decoration: none; transition: transform .1s ease-out; }
  .chg .go:has(svg) { padding-right: 12px; }
  .chg .go svg { width: 18px; height: 18px; display: block; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .from-bir .chg .go { border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
  .chg .go:active { transform: scale(.96); }
  .empty { margin-top: 16px; padding: 18px; border-radius: 18px; background: var(--surface-2); color: var(--muted); font-size: 15px; line-height: 1.6; }
  .empty b { display: block; color: var(--text); }
  .loading { margin-top: 16px; font-size: 14px; color: var(--muted); text-align: center; }

  .composer { position: sticky; bottom: 0; z-index: 20; margin: 0 -16px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 -1px 0 color-mix(in srgb, var(--line) 60%, transparent); }
  .cm-row { display: flex; align-items: flex-end; gap: 8px; }
  body.typing .composer { padding-bottom: 10px; }   /* 鍵盤打開時下面的安全區被鍵盤蓋住，不用再留 */
  .composer textarea { flex: 1; min-width: 0; min-height: 44px; max-height: 140px; margin: 0; padding: 9px 14px; resize: none;
    font: inherit; font-size: 16px; line-height: 1.5; color: var(--text); background: var(--surface);
    border: 1px solid color-mix(in srgb, var(--line) 90%, var(--muted) 10%); border-radius: 14px; }
  .composer textarea::placeholder { color: var(--muted); }
  .send { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 25%, transparent); transition: transform .1s ease-out; }
  .send:active { transform: scale(.94); }
  .send svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ===== 頁面標籤（從分享頁的泡泡打開時）：送出的訊息上方「正在看」、輸入列上方「會帶上」 ===== */
  .ctx { display: inline-flex; align-items: center; gap: 6px; max-width: min(84%, 520px); margin: 0 0 4px; padding: 3px 10px 3px 6px; border-radius: 8px;
    background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; line-height: 1.6;
    border: 1px solid color-mix(in srgb, var(--line) 85%, transparent); }
  .ctx > span { flex: none; display: grid; }
  .ctx svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ctx b { min-width: 0; color: var(--text); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cx-row { display: flex; align-items: center; gap: 4px; margin: 0 0 6px; }
  .cx-row .ctx { min-width: 0; max-width: none; margin: 0; }
  .cx-x { flex: none; display: grid; place-items: center; width: 44px; height: 44px; margin: -6px 0; padding: 0; border: 0; border-radius: 999px;
    background: none; color: var(--muted); cursor: pointer; transition: transform .1s ease-out; }
  .cx-x:active { transform: scale(.94); }
  .cx-x svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

  /* ===== embed：在分享頁泡泡的面板（iframe）裡。標題、關閉在父頁；這裡只留狀態列和換身分 ===== */
  html.embed, html.embed body { overscroll-behavior: contain; }   /* 在對話裡往下拉，不帶動後面的分享頁 */
  .embed .appbar { padding: 0 16px 6px; }
  .eb-row { display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .eb-row .bir-status { flex: 1; min-width: 0; margin: 0; }
  .eb-row .bir-status.off { margin: 0; padding: 0; background: none; }
  .eb-row .ab-who { margin-left: auto; }
  .embed .offline { margin-bottom: -6px; }

  /* ===== 手機手感：控制項不選字、不等雙擊判斷；hover 只給滑鼠 ===== */
  button, .btn, .ab-back, .chg .go, .who button, .send, .retry, .cx-x {
    touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  @media (hover: hover) and (pointer: fine) {
    .who button:hover { background: var(--surface-2); }
    .ab-who:hover span { color: var(--text); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .m.fresh { animation: rise .3s cubic-bezier(.16, 1, .3, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media (prefers-reduced-transparency: reduce) {
    .appbar, .composer { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
</style>
</head>

// ===== 加解密：站資料用站金鑰；{token, chat_key} 用密語導出的金鑰；訊息用 chat_key（格式同 build.encrypt） =====
function getKey() {
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if (m) { try { localStorage.setItem(STORE, m[1]); } catch (e) {} return m[1]; }
  try { return localStorage.getItem(STORE); } catch (e) { return null; }
}
async function decrypt(keyText) {
  const key = await crypto.subtle.importKey("raw", b64u(keyText), "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return JSON.parse(utf8(pt));
}
// PBKDF2-SHA256（salt＝站金鑰原始 bytes）＋ AES-GCM。密語不對會丟錯。
async function unwrap(pass, keyText, w) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64u(keyText), iterations: w.it },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(w.iv) }, key, b64(w.ct));
  return JSON.parse(utf8(pt));
}
async function seal(obj) {

  return { v: 1, iv: b64enc(iv), ct: b64enc(ct) };
}
async function open(blob) {
  return JSON.parse(utf8(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, CK, b64(blob.ct))));
}

// ===== 訊息：時間用台灣時間（+08:00），路徑跟 chatcrypto.msg_path 同格式，id＝檔名主幹 =====
function nowTW() {
  const t = new Date(Date.now() + 8 * 3600 * 1000).toISOString();  // 把 UTC 時鐘撥到 +8，再接上 +08:00
  return t.slice(0, 19) + "+08:00";
}
function newMessage(text, ctx = null) {
  const hex = [...crypto.getRandomValues(new Uint8Array(3))].map(b => b.toString(16).padStart(2, "0")).join("");
  const at = nowTW(), id = `${at.replace(/:/g, "")}_${WHO}_${hex}`;
  const msg = { id, at, from: WHO, text, reply_to: null, changes: null, undo_id: null };
  const c = cleanCtx(ctx);
  if (c) msg.ctx = c;              // 跟其他欄位一起用 chat_key 加密
  return { path: `msgs/${at.slice(0, 7)}/${id}.json`, msg };
}
const stem = path => path.slice(path.lastIndexOf("/") + 1, -5);

// ===== GitHub API：所有連線都走這裡 =====
class AuthError extends Error {}
class TempError extends Error {}   // 用量暫時用完：不清密語，等一下再試
let BACKOFF_UNTIL = 0;
const REPO = () => `/repos/${encodeURIComponent(DATA.owner)}/${encodeURIComponent(DATA.repo)}`;
async function gh(path, { method = "GET", body = null, etag = "" } = {}) {
  if (Date.now() < BACKOFF_UNTIL) throw new TempError("backoff");
  const headers = { Accept: "application/vnd.github+json", Authorization: "Bearer " + SECRET.token };
  if (etag) headers["If-None-Match"] = etag;
  if (body) headers["Content-Type"] = "application/json";
  const r = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : null, cache: "no-store" });
  // 429，以及帶 Retry-After 或剩餘次數 0 的 403，是用量暫時用完：退避後再試，不當成權限過期
  const retryAfter = r.headers.get("retry-after"), reset = r.headers.get("x-ratelimit-reset");
  if (r.status === 429 || (r.status === 403 && (retryAfter || r.headers.get("x-ratelimit-remaining") === "0"))) {
    const wait = retryAfter ? Number(retryAfter) * 1000 : reset ? Number(reset) * 1000 - Date.now() : 60000;
    BACKOFF_UNTIL = Date.now() + Math.min(Math.max(wait || 60000, 5000), 15 * 60000);
    throw new TempError("rate limit " + r.status);

  return r;
}
const blobJSON = content => JSON.parse(utf8(b64(content.replace(/\s/g, ""))));

const MSGS = new Map();            // path -> 解開的訊息
const BAD = new Set();             // 解不開的檔，不再重抓
let TREE = [], TREE_TRUNC = false, TREE_ETAG = "", STATUS_ETAG = "", STATUS;   // STATUS：undefined＝還不知道、null＝沒有狀態檔
let CACHE = readJSON(CACHE_STORE) || {};
let SENT = readJSON(SENT_STORE) || {};

async function loadMsg(t) {

  if (!blob) {
    const r = await gh(`${REPO()}/git/blobs/${t.sha}`);
    if (!r.ok) throw new Error("blob " + r.status);
    blob = blobJSON((await r.json()).content);
  }
  try {
    const m = await open(blob);
    MSGS.set(t.path, { ...m, id: m.id || stem(t.path) });
    CACHE[t.path] = blob;
  } catch (e) { BAD.add(t.path); }
}
// repo 已經沒有的訊息，本機快取也拿掉（清空 msgs/ 後，開過的裝置不會一直顯示舊訊息）。
// 不刪：還在待送佇列的、本機剛送成功但 tree 還沒反映的（寬限期內）。
function pruneToTree() {
  const inTree = new Set(TREE.map(t => t.path)), queued = new Set(OUT.map(x => x.path)), now = Date.now();
  let changed = false;
  for (const path of new Set([...MSGS.keys(), ...Object.keys(CACHE)])) {
    if (!MSG_PATH.test(path) || inTree.has(path) || queued.has(path)) continue;
    if (SENT[path] && now - SENT[path] < SENT_GRACE_MS) continue;
    MSGS.delete(path); delete CACHE[path]; BAD.delete(path); changed = true;
  }
  for (const path of Object.keys(SENT)) if (inTree.has(path) || now - SENT[path] >= SENT_GRACE_MS) { delete SENT[path]; changed = true; }
  if (changed) { writeJSON(CACHE_STORE, CACHE); writeJSON(SENT_STORE, SENT); }

async function loadTree() {

  if (r.status === 404 || r.status === 409) TREE = [];          // 空的 repo、還沒有 main
  else if (r.status !== 304) {
    if (!r.ok) throw new Error("tree " + r.status);
    const j = await r.json();
    TREE_ETAG = r.headers.get("ETag") || "";
    TREE = (j.tree || []).filter(t => t.type === "blob" && MSG_PATH.test(t.path));
    TREE_TRUNC = j.truncated === true;
    if (!TREE_TRUNC) pruneToTree();                                // 200 而且沒截斷才同步；304、錯誤、截斷都不刪
  }

  // 一則抓不到不影響其他則；抓不到的還不在 MSGS，下一輪會自動再抓
  for (let i = 0; i < todo.length; i += 6) {
    const rs = await Promise.allSettled(todo.slice(i, i + 6).map(loadMsg));
    const auth = rs.find(x => x.status === "rejected" && x.reason instanceof AuthError);

async function loadStatus() {

  if (r.status === 404 || r.status === 409) { STATUS = null; return; }
  if (!r.ok) throw new Error("status " + r.status);
  STATUS_ETAG = r.headers.get("ETag") || "";
  try { STATUS = await open(blobJSON((await r.json()).content)); } catch (e) { STATUS = null; }
}

// ===== 送出：先進待送佇列（存手機），一則一則送；成功才拿掉 =====
// 422 只有在「那個路徑已經有檔」時才算送到（上次其實送到了、只是沒收到回應）：
// 回應提到 sha，或另外 GET 那個路徑確認存在。其他 422 照失敗處理。
async function alreadyThere(r, path) {
  let msg = "";
  try { msg = String((await r.json()).message || ""); } catch (e) {}
  if (/\bsha\b/i.test(msg)) return true;
  try { return (await gh(`${REPO()}/contents/${path}`)).ok; } catch (e) { if (e instanceof AuthError) throw e; return false; }
}
let FLUSHING = false;
async function flush() {
  if (FLUSHING || !SECRET || !navigator.onLine) return;

    for (const item of OUT.filter(x => x.state === "queued")) {
      try {
        const blob = await seal(item.msg);
        const r = await gh(`${REPO()}/contents/${item.path}`, { method: "PUT",
          body: { message: "msg", content: b64enc(new TextEncoder().encode(JSON.stringify(blob))) } });
        if (r.ok || (r.status === 422 && await alreadyThere(r, item.path))) {
          OUT = OUT.filter(x => x !== item);
          MSGS.set(item.path, item.msg);
          if (r.ok) CACHE[item.path] = blob;
          SENT[item.path] = Date.now(); writeJSON(SENT_STORE, SENT);
          sent = true;
        } else {
          item.attempts = (item.attempts || 0) + 1;
          item.err = "HTTP " + r.status;
          if (item.attempts >= 2 || r.status === 422) item.state = "failed";   // 409（同時寫）、5xx 先自動再送一次；422 再送也一樣
        }

        if (e instanceof AuthError) return;
        if (e instanceof TempError) break;               // 用量暫時用完：留在佇列，退避結束再送
        item.attempts = (item.attempts || 0) + 1;
        item.err = String(e.message || e);
        if (navigator.onLine) item.state = "failed";     // 沒網路就留著排隊，連上自動送
      }

      writeJSON(CACHE_STORE, CACHE);
      paint();
    }

  }

}

// ===== 輪詢：畫面看得到時每 4 秒一次；送出後等 Bir 回覆時每 1.5 秒（最多 5 分鐘）；樹沒變 GitHub 回 304，不算用量 =====
let TIMER = 0, TICKING = false;
const pollCfg = () => {
  const p = DATA && DATA.poll, ok = v => typeof v === "number" && isFinite(v);
  return p ? { ms: ok(p.ms) ? Math.max(p.ms, 1000) : POLL_DEFAULT.ms, fast_ms: ok(p.fast_ms) ? Math.max(p.fast_ms, 1000) : POLL_DEFAULT.fast_ms,
               fast_for_ms: ok(p.fast_for_ms) ? p.fast_for_ms : POLL_DEFAULT.fast_for_ms } : POLL_DEFAULT;
};
const atMs = m => { const t = Date.parse(m && m.at); return isNaN(t) ? -Infinity : t; };
// 在等 Bir：有網路而且還有沒送出去的訊息，或最新一則人說的話是 fast_for_ms 內送的、還沒有 Bir 訊息回它（reply_to）。

function waitingBir() {
  if (navigator.onLine && OUT.some(x => x.state === "queued")) return true;
  let last = null;
  // 跟 relay 同一套排序（at，同一秒再比 id），才會挑到 Bir 的 reply_to 指的那則
  for (const m of MSGS.values()) if (m.from !== "bir" && (!last || atMs(m) > atMs(last) || (atMs(m) === atMs(last) && m.id > last.id))) last = m;
  if (!last || Date.now() - atMs(last) >= pollCfg().fast_for_ms) return false;

  for (const m of MSGS.values()) if (m.from === "bir" && m.reply_to === id) return false;

function birBusy() {
  if (!STATUS || !STATUS.busy) return false;

  for (const m of MSGS.values()) if (m.from === "bir" && atMs(m) >= hb) return false;

async function tick() {

  } catch (e) {
    if (e instanceof AuthError) return;
    NET_ERR = true;                     // 沒網路或 GitHub 連不上：下一輪自動再試
  } finally { TICKING = false; LOADED = true; }

}
document.addEventListener("visibilitychange", () => schedule(true));
addEventListener("online", () => { for (const x of OUT) if (x.state === "failed") x.state = "queued"; saveOut(); paintStatus(); schedule(true); });
addEventListener("offline", () => { paintStatus(); paint(); });

// ===== embed：跟父頁（分享頁）溝通。只收同網域、而且來源是父頁的；送的時候 targetOrigin 寫自己的 origin。
// 金鑰不經這裡（同網域，自己從 localStorage 讀）；父頁只傳 {type, slug, view, label} 和暫停／繼續。 =====
const toParent = m => { if (EMBED) { try { parent.postMessage(m, location.origin); } catch (e) {} } };

if (EMBED) {
  document.documentElement.classList.add("embed");
  addEventListener("message", e => {
    if (e.source !== parent || e.origin !== location.origin) return;
    const d = e.data;
    if (!d || typeof d !== "object") return;
    if (d.type === "bir:ctx") {
      const c = cleanCtx(d);
      if (JSON.stringify(c) !== JSON.stringify(CTX)) { CTX = c; CTX_OFF = false; paintCtx(); }
    } else if (d.type === "bir:pause") { PAUSED = true; clearTimeout(TIMER); }
    else if (d.type === "bir:resume") { PAUSED = false; schedule(true); }

    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    toParent({ type: "bir:leave" });
    setTimeout(() => { try { top.location.href = a.href; } catch (x) { window.open(a.href, "_top"); } }, 60);
  });
}

// ===== 畫面 =====
const WEEK = "日一二三四五六";
function dayLabel(at) {

const nameOf = from => N[from] || from;

  "pack-todo": "行李 › 出發前要做", "pack-packing": "行李 › 打包清單",
  "more-menu": "更多", "more-money": "換算", "more-sos": "應急", "more-budget": "預算", "more-price": "價格追蹤",
  "more-notes": "小提醒", "more-sources": "資料來源", "more-changelog": "更新紀錄",

function pageName(slug, view) {

const ctxCard = (prefix, c) => el("div", { class: "ctx" }, ic("map"), prefix, el("b", {}, c.label));

let LIST = null, EMPTY = null, LOADING = null, STATUS_EL = null, OFFLINE_EL = null, CX_ROW = null;

      if (!cur && !FIRST_PAINT) node.classList.add("fresh");
      if (cur) cur.node.replaceWith(node);
      cur = { sig: w.sig, node };
      NODES.set(w.key, cur);
      changed = true;
    }
    if (LIST.children[i] !== cur.node) { LIST.insertBefore(cur.node, LIST.children[i] || null); changed = true; }
  });
  EMPTY.hidden = !!all.length || !LOADED;
  LOADING.hidden = !!all.length || LOADED;
  if (all.length) FIRST_PAINT = false;
  if (LOADED && LIST.hasAttribute("aria-busy")) requestAnimationFrame(() => LIST && LIST.removeAttribute("aria-busy"));
  paintStatus();
  if (near && changed) requestAnimationFrame(() => doc.scrollTo(0, doc.scrollHeight));
}
function paintStatus() {
  if (!STATUS_EL) return;
  OFFLINE_EL.hidden = navigator.onLine;
  let text = "", cls = "bir-status";
  if (navigator.onLine && (STATUS !== undefined || NET_ERR)) {
    const t = STATUS && Date.parse(STATUS.online_at);
    if (NET_ERR) { text = "現在連不上，等一下會自動再試"; cls += " off"; }
    else if (!STATUS || !t || Date.now() - t > OFFLINE_AFTER) { text = say("Bir 現在離線，留言會在電腦開機後回"); cls += " off"; }
    else if (birBusy()) { text = say("Bir 正在看"); cls += " busy"; }
    else text = STATUS.note || say("Bir 在線上");
  }
  STATUS_EL.className = cls;
  STATUS_EL.hidden = !text;
  if (STATUS_EL.textContent !== text) STATUS_EL.textContent = text;
}

// 輸入列上方「會帶上：…」：只在 embed、父頁有傳標籤、而且這一則沒按 ✕ 時出現
function paintCtx() {
  if (!CX_ROW) return;
  const on = !!(EMBED && CTX && !CTX_OFF);
  CX_ROW.hidden = !on;
  if (!on) return CX_ROW.replaceChildren();
  const x = el("button", { type: "button", class: "cx-x", "aria-label": "這則不要帶頁面標籤" }, ic("x"));
  x.addEventListener("click", () => { CTX_OFF = true; paintCtx(); fineFocus(document.getElementById("compose")); });
  CX_ROW.replaceChildren(ctxCard("會帶上：", CTX), x);
}
function chatView() {
  NODES.clear(); FIRST_PAINT = true;
  const back = el("a", { class: "ab-back", href: "../" }, ic("back"), "分享");
  const whoBtn = el("button", { type: "button", class: "ab-who", "aria-label": `換身分（現在是 ${nameOf(WHO)}）` }, el("span", {}, "我是 " + nameOf(WHO)));
  whoBtn.addEventListener("click", () => whoPicker());
  STATUS_EL = el("p", { class: "bir-status", role: "status", hidden: true });
  OFFLINE_EL = el("div", { class: "offline", role: "status", hidden: true }, "沒有網路，訊息會先存在手機，連上再送");
  LIST = el("ol", { class: "msgs", "aria-live": "polite", "aria-busy": "true", "aria-label": "對話" });  // 第一次載入完才拿掉 busy，免得把整段歷史念出來
  EMPTY = el("div", { class: "empty", hidden: true }, el("b", {}, "還沒有訊息"), say("想改行程、問問題，直接跟 Bir 說。"));
  LOADING = el("p", { class: "loading" }, "正在拿訊息…");
  const box = el("textarea", { id: "compose", rows: 1, maxlength: 2000, enterkeyhint: "send", autocomplete: "off",
    placeholder: say("跟 Bir 說…"), "aria-label": say("給 Bir 的訊息") });
  CX_ROW = el("div", { class: "cx-row", hidden: true });
  const form = el("form", { class: "composer" }, CX_ROW, el("div", { class: "cm-row" }, box,
    el("button", { type: "submit", class: "send", "aria-label": "送出" }, ic("send"))));
  const grow = () => { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight + 2, 140) + "px"; };
  box.addEventListener("input", grow);
  box.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); form.requestSubmit ? form.requestSubmit() : send(); }
  });
  const send = () => {
    const text = box.value.trim();
    if (!text) return;
    const { path, msg } = newMessage(text, EMBED && !CTX_OFF ? CTX : null);
    CTX_OFF = false; paintCtx();       // ✕ 只影響這一則
    OUT.push({ id: msg.id, path, msg, state: "queued", attempts: 0, err: null });
    saveOut();
    box.value = ""; grow();
    paint(true);
    flush();
  };
  form.addEventListener("submit", e => { e.preventDefault(); send(); });
  const header = EMBED   // 標題、關閉鍵在父頁的面板上；這裡只留狀態和換身分
    ? el("header", { class: "appbar" }, el("div", { class: "eb-row" }, STATUS_EL, whoBtn), OFFLINE_EL)
    : el("header", { class: "appbar" }, el("div", { class: "ab-row" }, back, el("h1", { class: "ab-title" }, N.bir), whoBtn), STATUS_EL, OFFLINE_EL);
  app().replaceChildren(el("div", { class: "chat" }, header,
    el("main", { class: "thread" }, LIST, LOADING, EMPTY),
    form));
  paintCtx();
  paint(true);
}
// 打字時收起安全區；embed 時告訴父頁（iframe 裡的 focusin 不會冒泡到父頁），父頁把面板改成滿高
document.addEventListener("focusin", e => { if (e.target.id === "compose") { document.body.classList.add("typing"); toParent({ type: "bir:typing", on: true }); } });
document.addEventListener("focusout", e => { if (e.target.id === "compose") { document.body.classList.remove("typing"); toParent({ type: "bir:typing", on: false }); } });

// ===== 開始：密語 → 選身分 → 對話 =====
// embed 時多一個「在新頁打開對話」（整頁換過去）；不退回用網址帶金鑰
const gate = (t, m) => { LIST = null; CX_ROW = null; app().replaceChildren(el("div", { class: "gate" }, el("div", {}, el("b", {}, t), m,
  EMBED ? el("p", {}, el("a", { class: "btn", href: "./", target: "_top" }, "在新頁打開對話")) : null))); };
async function start(secret) {
  SECRET = secret;
  CK = await crypto.subtle.importKey("raw", b64u(secret.chat_key), "AES-GCM", false, ["encrypt", "decrypt"]);
  for (const [path, blob] of Object.entries(CACHE)) {          // 先顯示上次收過的，沒網路也看得到
    if (!MSG_PATH.test(path)) continue;
    try { const m = await open(blob); MSGS.set(path, { ...m, id: m.id || stem(path) }); } catch (e) { delete CACHE[path]; }
  }
  WHO = readJSON(WHO_STORE);
  if (!H.includes(WHO)) return whoPicker();
  chatView();
  schedule(true);
}
function whoPicker() {
  LIST = null;
  const pick = w => { WHO = w; writeJSON(WHO_STORE, w); chatView(); schedule(true); };
  const btn = w => { const b = el("button", { type: "button", "data-who": roleOf(w) }, el("span", { class: "sw", "aria-hidden": "true" }, nameOf(w).slice(0, 1)), "我是 " + nameOf(w)); b.addEventListener("click", () => pick(w)); return b; };
  app().replaceChildren(el("div", { class: "gate" }, el("div", { class: "card" },
    el("b", {}, "這支手機是誰在用？"),
    el("div", { class: "who" }, btn(H[0]), btn(H[1])),
    el("p", { class: "note" }, "只是用來標示誰說的，之後可以在右上角換。"))));
}
function expired() {
  clearTimeout(TIMER);
  SECRET = null;
  try { localStorage.removeItem(SECRET_STORE); } catch (e) {}
  // 換 token 一定會重新 build 頁面（新的 wrapped 在新頁裡），所以要重新載入，不能在這一頁重輸密語
  LIST = null;
  const again = el("button", { type: "button", class: "btn", id: "reopen" }, "重新開一次");
  again.addEventListener("click", () => location.reload());
  app().replaceChildren(el("div", { class: "gate" }, el("div", { class: "card" },
    el("b", {}, say("連線權限過期，請跟 %owner% 說")),
    el("p", {}, say("目前的連線權限已經不能用了。%owner% 換好之後，按下面的按鈕重新開一次，再輸入對話密語；還沒送出的訊息會留在手機裡。")),
    again)));
}
let KEY_TEXT = "";
function passForm(keyText) {
  LIST = null;
  const input = el("input", { id: "pass", type: "password", autocomplete: "off", autocapitalize: "off", spellcheck: "false", enterkeyhint: "go" });
  const err = el("p", { class: "err", role: "alert" });
  const form = el("form", { class: "pass" }, el("label", { for: "pass" }, "對話密語"), input, err,
    el("button", { type: "submit", class: "btn" }, "打開對話"));
  form.addEventListener("submit", async e => {
    e.preventDefault();
    err.textContent = "";
    let secret;
    try { secret = await unwrap(input.value, keyText, DATA.wrapped); }
    catch (x) { err.textContent = "密語不對，再試一次"; input.select(); return; }
    writeJSON(SECRET_STORE, { token: secret.token, chat_key: secret.chat_key });
    start(secret);
  });
  app().replaceChildren(el("div", { class: "gate" }, el("div", { class: "card" },
    el("b", {}, "跟 " + N.bir + " 說話"),
    el("p", {}, say("第一次打開要輸入對話密語，密語是 %owner% 私下給的。輸入一次，這支手機就會記住。")),
    form)));
  fineFocus(input);
}

(async () => {
  if (!PAYLOAD) return gate("還沒有內容", "這一頁還沒產生資料。");
  if (!window.crypto?.subtle) return gate("瀏覽器不支援", "請用 Safari、Chrome 等新版瀏覽器打開。");
  const key = getKey();
  if (!key) return gate("需要分享連結", "請用對方傳給你的完整連結打開這一頁。");
  try { DATA = await decrypt(key); }
  catch (e) { return gate("連結不完整或已更換", "請跟對方要最新的分享連結。"); }
  KEY_TEXT = key;
  H = Array.isArray(DATA.humans) && DATA.humans.length === 2 ? DATA.humans : [];
  N = { bir: "Bir", ...(DATA.names || {}) };
  loadFonts(DATA._fonts);
  document.title = N.bir;
  const saved = readJSON(SECRET_STORE);
  if (saved && saved.token && saved.chat_key) {
    try { await start(saved); } catch (e) { passForm(key); }
  } else passForm(key);
})();
</script>
