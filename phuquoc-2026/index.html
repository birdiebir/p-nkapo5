<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>分享</title>
<style>
  :root {
    --bg: #f6f7f6; --surface: #ffffff; --surface-2: #eef2f1;
    --text: #17201e; --muted: #5b6764; --line: #dde3e1;
    --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #dff1ee;
    --warn: #9a4a07; --warn-soft: #fdf0dc;
    --radius: 14px; --shadow: 0 1px 2px rgb(15 60 55 / .06), 0 8px 24px rgb(15 60 55 / .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1413; --surface: #161d1b; --surface-2: #1d2624;
      --text: #e7eeec; --muted: #9aa8a4; --line: #27322f;
      --accent: #3fb5a8; --accent-ink: #0b1312; --accent-soft: #173330;
      --warn: #f2b25c; --warn-soft: #3a2a12;
      --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  a { color: var(--accent); }
  .wrap { max-width: 720px; margin: 0 auto;
    padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .back { display: inline-flex; align-items: center; min-height: 44px; margin-top: 4px; font-size: 15px; font-weight: 600; text-decoration: none; }
  header.top { padding: 12px 0 8px; }
  .title { font-size: clamp(28px, 7vw, 40px); line-height: 1.15; font-weight: 800; letter-spacing: -.01em; margin: 0; }
  .sub { color: var(--muted); margin: 6px 0 0; }
  .countdown { margin: 14px 0 0; padding: 12px 14px; border-radius: var(--radius); background: var(--accent-soft); color: var(--accent); font-weight: 650; }
  .countdown b { font-size: 26px; font-variant-numeric: tabular-nums; margin: 0 2px; }
  .countdown small { display: block; font-weight: 500; font-size: 14px; color: var(--text); margin-top: 2px; }
  .offline { position: sticky; top: 0; z-index: 20; margin: 0 -16px; padding: 8px 16px; font-size: 14px; text-align: center;
    background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .updated { font-size: 14px; color: var(--muted); margin-top: 10px; }
  .status { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; padding: 0; list-style: none; }
  .status li { font-size: 14px; padding: 6px 12px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .status li.ok { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  nav.days {
    position: sticky; top: 0; z-index: 10; background: var(--bg); background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    margin: 12px -16px 0; padding: calc(8px + env(safe-area-inset-top)) 16px 8px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    border-bottom: 1px solid var(--line); overscroll-behavior-x: contain; scroll-padding-inline: 16px;
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
  }
  nav.days::-webkit-scrollbar { display: none; }
  nav.days a {
    flex: none; text-decoration: none; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 0 16px; min-height: 40px; display: inline-flex; align-items: center;
    font-size: 15px; white-space: nowrap; transition: background .2s, color .2s, border-color .2s;
  }
  nav.days a:last-child { margin-right: 24px; }
  nav.days a.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
  nav.days a.is-today:not(.active) { border-color: var(--accent); color: var(--accent); }
  nav.days a:active { transform: scale(.97); }

  section { margin-top: 28px; scroll-margin-top: calc(72px + env(safe-area-inset-top)); }
  h2 { font-size: 20px; margin: 0 0 12px; line-height: 1.3; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }

  .picks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .pick b { display: block; font-size: 15px; }
  .pick span { font-size: 14px; color: var(--muted); }
  .pick.done { border-color: var(--accent); }
  .pick.done b::after { content: " ✓"; color: var(--accent); }

  .day-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .day-head .d { font-size: 14px; font-weight: 700; color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 2px 10px; }
  .day-head .date { color: var(--muted); font-size: 14px; }
  .today-badge { font-size: 13px; font-weight: 700; color: var(--accent); border: 1.5px solid var(--accent); border-radius: 999px; padding: 1px 9px; }
  section.today > .card { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
  .day-summary { color: var(--muted); margin: 6px 0 12px; }
  ol.tl { list-style: none; margin: 0; padding: 0; }
  ol.tl li { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  ol.tl li:first-child { border-top: 0; padding-top: 4px; }
  .time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; color: var(--muted); padding-top: 1px; }
  .it-title { font-weight: 650; }
  .it-note { font-size: 15px; color: var(--muted); margin-top: 2px; }
  .it-links { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .it-links a { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 14px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 600; text-decoration: none; }
  .it-links a::after { content: "↗"; font-size: 12px; }
  .it-links a:active { transform: scale(.97); }
  li.star .time { color: var(--accent); }
  li.star .it-title::before { content: "★ "; color: var(--accent); }
  li.opt .it-title::after { content: "（選擇性）"; font-weight: 400; font-size: 14px; color: var(--muted); }
  .rain { margin-top: 10px; font-size: 15px; border-left: 3px solid var(--muted); padding: 6px 0 6px 12px; color: var(--text); }
  .rain b { display: block; font-size: 13px; color: var(--muted); }
  .tip { margin-top: 12px; font-size: 15px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }

  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  @media (max-width: 480px) {
    .kv { grid-template-columns: 1fr; gap: 0; }
    .kv dt { font-size: 13px; font-weight: 600; margin-top: 12px; }
    .kv dt:first-child { margin-top: 0; }
    .kv dd { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .kv dd:last-of-type { border-bottom: 0; padding-bottom: 0; }
  }
  .map-btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; margin-top: 12px; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); font-weight: 650; text-decoration: none; }

  table.money { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.money td { padding: 8px 0; vertical-align: top; }
  table.money tr + tr td { border-top: 1px solid var(--line); }
  table.money td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 12px; }
  table.money td small { display: block; color: var(--muted); font-size: 14px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding-top: 12px; border-top: 2px solid var(--text); }
  .total b { font-size: 22px; }
  .fine { font-size: 14px; color: var(--muted); margin-top: 8px; }

  ul.check { list-style: none; margin: 0; padding: 0; }
  ul.check label { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 10px 0; min-height: 44px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  ul.check li + li { border-top: 1px solid var(--line); }
  input.box { appearance: none; -webkit-appearance: none; display: grid; place-items: center; width: 22px; height: 22px; margin: 2px 0 0;
    border: 2px solid var(--muted); border-radius: 6px; background: var(--surface); cursor: pointer; transition: background .15s, border-color .15s; }
  input.box:checked { background: var(--accent); border-color: var(--accent); }
  input.box:checked::after { content: ""; width: 5px; height: 11px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  input.box:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input.box:disabled { opacity: .7; cursor: default; }
  .check-hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  details.mine { margin-top: 12px; border-top: 1px dashed var(--line); }
  details.mine summary { display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 650; color: var(--accent); cursor: pointer; list-style: none; }
  details.mine summary::-webkit-details-marker { display: none; }
  details.mine summary::before { content: "＋"; }
  details.mine[open] summary::before { content: "－"; }
  details.mine summary small { font-weight: 500; color: var(--muted); }
  details.mine textarea { box-sizing: border-box; width: 100%; min-height: 96px; padding: 10px 12px; font: inherit; font-size: 16px; line-height: 1.5;
    color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; resize: vertical; }
  details.mine textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  details.mine .saved { min-height: 18px; font-size: 13px; color: var(--muted); margin-top: 4px; }
  li.done .txt { color: var(--muted); text-decoration: line-through; }
  .due { display: inline-block; font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 0 8px; margin-left: 6px; }
  li.overdue .due, li.soon .due { color: var(--warn); background: var(--warn-soft); }
  .addr { border: 2px solid var(--accent); }
  .addr .vi { font-size: 22px; line-height: 1.45; font-weight: 700; margin: 6px 0 4px; }
  .addr .lbl { font-size: 14px; color: var(--muted); }
  ul.calls { list-style: none; margin: 0; padding: 0; }
  ul.calls li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
  ul.calls li + li { border-top: 1px solid var(--line); }
  ul.calls small { display: block; color: var(--muted); font-size: 14px; }
  .tel { flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; font-variant-numeric: tabular-nums; }
  ul.src { margin: 0; padding-left: 18px; font-size: 14px; }
  ul.src a { word-break: break-word; }
  .who { display: inline-block; font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 0 8px; margin-left: 6px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 14px; }

  ul.log { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
  footer { margin-top: 40px; font-size: 14px; color: var(--muted); text-align: center; }

  .gate { min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
  .gate b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
  .skeleton { height: 18px; border-radius: 8px; background: var(--surface-2); margin: 12px 0; }

  @media (prefers-reduced-motion: no-preference) {
    section { animation: rise .3s cubic-bezier(.16, 1, .3, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    html { scroll-behavior: smooth; }
  }
  @media (max-width: 380px) { .picks { grid-template-columns: 1fr; } ol.tl li { grid-template-columns: 54px 1fr; } }
</style>
</head>

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
const mapUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const navUrl = q => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(q);
const DAY = 864e5;
const today0 = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const isoDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
// 自己的勾選和筆記：只存在這支手機（localStorage），不會上傳、不會傳給別人
const MINE = "mine:" + location.pathname;
const mine = (() => { try { return JSON.parse(localStorage.getItem(MINE)) || {}; } catch (e) { return {}; } })();
mine.checks = mine.checks || {};
mine.notes = mine.notes || {};
const saveMine = () => { try { localStorage.setItem(MINE, JSON.stringify(mine)); return true; } catch (e) { return false; } };
const isDone = c => !!(c.done || mine.checks[c.text]);
let DATA = null;
function refreshCountdown() {
  const old = document.getElementById("countdown"), now = countdown(DATA);
  if (old && now) old.replaceWith(now); else if (old) old.remove();
}
function noteBox(day) {
  const k = `${day.label}|${day.date}`;
  const ta = el("textarea", { placeholder: "想吃的店、想拍的照片、想買的東西……", "aria-label": `${day.label} 我的筆記` });
  ta.value = mine.notes[k] || "";
  const flag = el("small", {}, ta.value ? "（有寫）" : "");
  const saved = el("div", { class: "saved", "aria-live": "polite" });
  let timer;
  ta.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const v = ta.value.trim() ? ta.value : "";
      if (v) mine.notes[k] = v; else delete mine.notes[k];
      saved.textContent = saveMine() ? "已存在這支手機" : "存不起來（可能是無痕模式）";
      flag.textContent = v ? "（有寫）" : "";
    }, 400);
  });
  return el("details", { class: "mine", open: ta.value ? "" : null }, el("summary", {}, "我的筆記", flag), ta, saved);
}
function checkItem(c) {
  const left = c.due ? Math.round((isoDate(c.due) - today0()) / DAY) : null;
  const box = el("input", { type: "checkbox", class: "box" });
  box.checked = isDone(c);
  if (c.done) box.disabled = true;
  const due = c.due ? el("span", { class: "due" }) : null;
  const li = el("li", {});
  const paint = () => {
    const done = isDone(c);
    li.className = done ? "done" : left == null ? "" : left < 0 ? "overdue" : left <= 3 ? "soon" : "";
    if (due) due.textContent = `${+c.due.slice(5, 7)}/${+c.due.slice(8)} 前${!done && left < 0 ? "（過期）" : ""}`;
  };
  box.addEventListener("change", () => {
    if (box.checked) mine.checks[c.text] = true; else delete mine.checks[c.text];
    saveMine(); paint(); refreshCountdown();
  });
  li.append(el("label", {}, box, el("div", { class: "txt" }, c.text, due, c.who ? el("span", { class: "who" }, c.who) : null)));
  paint();
  return li;
}
function countdown(d) {
  if (!d.depart) return null;
  const t = today0(), a = isoDate(d.depart), b = isoDate(d.return || d.depart);
  const left = Math.round((a - t) / DAY);
  const next = (d.checklist || []).filter(c => !isDone(c) && c.due).sort((x, y) => x.due.localeCompare(y.due))[0];
  const nextTxt = next ? el("small", {}, `下一件事：${next.text.split("：")[0].split("（")[0]}（${+next.due.slice(5, 7)}/${+next.due.slice(8)} 前）`) : null;
  if (left > 0) return el("div", { class: "countdown", id: "countdown" }, "距離出發還有", el("b", {}, left), "天", nextTxt);
  if (t <= b) return el("div", { class: "countdown", id: "countdown" }, "旅途中：第", el("b", {}, Math.round((t - a) / DAY) + 1), "天");
  return null;
}
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64u = s => b64(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));

}

function gate(title, msg) {
  const app = document.getElementById("app");

// 同一個站（第一層路徑）共用一把金鑰，子頁不用再帶 #k 也能解
const STORE = "sharekey:" + location.pathname.split("/").slice(0, 2).join("/");
let KEY_TEXT = null;

async function getKey() {
  const store = STORE;
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if (m) { try { localStorage.setItem(store, m[1]); } catch (e) {} return m[1]; }
  try { return localStorage.getItem(store); } catch (e) { return null; }
}

async function decrypt(keyText) {
  const key = await crypto.subtle.importKey("raw", b64u(keyText), "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function render(d) {
  DATA = d;
  document.title = d.title || "分享";
  const app = document.getElementById("app");
  const parts = [];

  parts.push(el("a", { class: "back", href: "../#k=" + KEY_TEXT }, "← 全部分享"));
  parts.push(el("header", { class: "top" },
    el("h1", { class: "title" }, d.title),
    el("p", { class: "sub" }, d.subtitle),
    el("ul", { class: "status" }, (d.status || []).map(s => el("li", { class: s.ok ? "ok" : null }, `${s.label}：${s.state}`))),
    countdown(d),
    el("div", { class: "updated" }, `最後更新 ${d.updated}，重新整理就會看到最新版`)
  ));

  const navLinks = [];
  if (d.picks) navLinks.push(["picks", d.picks.nav || d.picks.title]);
  (d.days || []).forEach((day, i) => navLinks.push([`day${i + 1}`, `${day.label} ${day.short || ""}`.trim()]));
  const now = new Date();
  const isToday = s => { const m = /(\d{1,2})\/(\d{1,2})/.exec(s || ""); return !!m && +m[1] === now.getMonth() + 1 && +m[2] === now.getDate(); };
  const todayIdx = (d.days || []).findIndex(day => isToday(day.date));

  if (d.checklist) navLinks.push(["todo", "出發前"]);
  parts.push(el("nav", { class: "days", "aria-label": "頁面導覽" }, navLinks.map(([id, t]) => el("a", { href: "#" + id, "data-jump": id, class: id === `day${todayIdx + 1}` ? "is-today" : null }, t))));

  if (d.picks) {
    parts.push(el("section", { id: "picks" },
      el("h2", {}, d.picks.title),
      el("div", { class: "picks" }, d.picks.items.map(p => el("div", { class: "pick" + (p.done ? " done" : "") }, el("b", {}, p.name), el("span", {}, p.where))))
    ));
  }

  (d.days || []).forEach((day, i) => {
    const today = i === todayIdx;
    parts.push(el("section", { id: `day${i + 1}`, class: today ? "today" : null },
      el("div", { class: "card" },
        el("div", { class: "day-head" }, el("span", { class: "d" }, day.label), el("h2", { style: "margin:0" }, day.title), el("span", { class: "date" }, day.date),
          today ? el("span", { class: "today-badge" }, "今天") : null),
        day.summary ? el("p", { class: "day-summary" }, day.summary) : null,
        el("ol", { class: "tl" }, day.items.map(it => el("li", { class: [it.star && "star", it.optional && "opt"].filter(Boolean).join(" ") || null },
          el("div", { class: "time" }, it.time),
          el("div", {},
            el("div", { class: "it-title" }, it.title),
            it.note ? el("div", { class: "it-note" }, it.note) : null,
            (it.map || it.link) ? el("div", { class: "it-links" },
              it.map ? el("a", { href: mapUrl(it.map), target: "_blank", rel: "noopener", "aria-label": `在地圖打開：${it.title}` }, "地圖") : null,
              it.map ? el("a", { href: navUrl(it.map), target: "_blank", rel: "noopener", "aria-label": `導航到：${it.title}` }, "導航") : null,
              it.link ? el("a", { href: it.link.url, target: "_blank", rel: "noopener" }, it.link.text) : null) : null
          )
        ))),
        day.rain ? el("div", { class: "rain" }, el("b", {}, "下雨的話"), day.rain) : null,
        day.tip ? el("div", { class: "tip" }, day.tip) : null,
        noteBox(day)
      )
    ));
  });

  if (d.transport) {
    parts.push(el("section", { id: "transport" },
      el("h2", {}, "交通"),
      el("div", { class: "card" }, el("dl", { class: "kv" }, (d.transport.rows || []).flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, v)])))
    ));
  }

  if (d.hotel) {
    const h = d.hotel;
    parts.push(el("section", { id: "hotel" },
      el("h2", {}, "住宿"),
      el("div", { class: "card" },
        el("dl", { class: "kv" }, (h.rows || []).flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, v)])),
        h.map ? el("a", { class: "map-btn", href: mapUrl(h.map), target: "_blank", rel: "noopener" }, "在地圖打開飯店 ↗") : null
      )
    ));
  }

  if (d.emergency) {
    const e = d.emergency;
    parts.push(el("section", { id: "sos" },
      el("h2", {}, "應急"),
      e.address ? el("div", { class: "card addr" },
        el("div", { class: "lbl" }, e.address.label),
        el("div", { class: "vi", lang: "vi" }, e.address.text),
        el("div", { class: "lbl" }, e.address.name),
        e.address.map ? el("a", { class: "map-btn", href: navUrl(e.address.map), target: "_blank", rel: "noopener" }, "導航回飯店 ↗") : null) : null,
      e.calls ? el("div", { class: "card", style: "margin-top:12px" }, el("ul", { class: "calls" }, e.calls.map(c => el("li", {},
        el("div", {}, c.label, c.note ? el("small", {}, c.note) : null),
        el("a", { class: "tel", href: "tel:" + c.number }, c.display || c.number))))) : null,
      e.notes ? el("ul", { class: "log", style: "margin-top:12px;color:var(--text);font-size:15px" }, e.notes.map(n => el("li", {}, n))) : null
    ));
  }

  if (d.budget) {
    const b = d.budget;
    parts.push(el("section", { id: "budget" },
      el("h2", {}, b.title),
      el("div", { class: "card" },
        el("table", { class: "money" }, el("tbody", {}, b.rows.map(r => el("tr", {},
          el("td", {}, r.item, r.note ? el("small", {}, r.note) : null),
          el("td", { class: "n" }, r.amount))))),
        el("div", { class: "total" }, el("span", {}, b.totalLabel), el("b", {}, b.total)),
        (b.fine || []).map(f => el("div", { class: "fine" }, f))
      )
    ));
  }

  if (d.checklist) {
    parts.push(el("section", { id: "todo" },
      el("h2", {}, "出發前要做的事"),
      el("div", { class: "card" },
        el("ul", { class: "check" }, d.checklist.map(checkItem)),
        el("p", { class: "check-hint" }, "打勾和筆記只存在這支手機，不會傳給別人；換手機或清除瀏覽資料就會不見。"))
    ));
  }

  if (d.packing) {
    parts.push(el("section", {}, el("h2", {}, "記得帶"), el("div", { class: "chips" }, d.packing.map(p => el("span", {}, p)))));
  }

  if (d.notes) {
    parts.push(el("section", {}, el("h2", {}, "小提醒"), el("div", { class: "card" }, el("ul", { class: "log", style: "color:var(--text);font-size:15px" }, d.notes.map(n => el("li", {}, n))))));
  }

  if (d.sources) {
    parts.push(el("section", {}, el("h2", {}, "資料來源"), el("ul", { class: "src" }, d.sources.map(s => el("li", {}, el("a", { href: s.url, target: "_blank", rel: "noopener" }, s.text))))));
  }

  if (d.changelog) {
    parts.push(el("section", {}, el("h2", {}, "更新紀錄"), el("ul", { class: "log" }, d.changelog.map(c => el("li", {}, `${c.date} ${c.text}`)))));
  }

  parts.push(el("footer", {}, d.footer || ""));
  app.replaceChildren(...parts);
  offlineBanner();

  document.querySelectorAll("[data-jump]").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    document.getElementById(a.dataset.jump)?.scrollIntoView();
  }));

  // 導覽列標出目前看到的段落，並把那顆膠囊捲進畫面
  const nav = document.querySelector("nav.days");
  const chips = new Map([...document.querySelectorAll("[data-jump]")].map(a => [a.dataset.jump, a]));
  const setActive = id => {
    chips.forEach((a, k) => a.classList.toggle("active", k === id));
    const a = chips.get(id);
    if (a && nav) nav.scrollTo({ left: a.offsetLeft - nav.clientWidth / 2 + a.offsetWidth / 2, behavior: "smooth" });
  };
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(es => {
      const vis = es.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (vis[0]) setActive(vis[0].target.id);
    }, { rootMargin: "-80px 0px -60% 0px" });
    chips.forEach((_, id) => { const sec = document.getElementById(id); if (sec) io.observe(sec); });
  }
  // 旅途中打開：直接捲到今天
  if (todayIdx >= 0) setTimeout(() => document.getElementById(`day${todayIdx + 1}`)?.scrollIntoView(), 300);
}

(async () => {
  if (!PAYLOAD) return gate("還沒有內容", "這一頁還沒產生資料。");
  if (!window.crypto?.subtle) return gate("瀏覽器不支援", "請用 Safari、Chrome 等新版瀏覽器打開。");
  const key = await getKey();
  if (!key) return gate("需要分享連結", "請用對方傳給你的完整連結打開這一頁。");
  try {
    KEY_TEXT = key;
    render(await decrypt(key));
  } catch (e) {
    gate("連結不完整或已更換", "請跟對方要最新的分享連結。");
  }
})();
</script>
</body>
</html>
